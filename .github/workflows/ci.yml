name: Tests and offline evaluations
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python -m evals.run --offline --output eval-reports/offline.json
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: eval-reports/offline.json
